name: Extension E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Allow/Block policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PS_API_DOMAIN: ${{ secrets.PS_API_DOMAIN }}
      PS_API_KEY: ${{ secrets.PS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Download the extension from the Chrome Web Store
        run: npm run fetch-extension

      - name: Type-check
        run: npx tsc -p .

      - name: Run tests
        run: npx playwright test

      - name: Write job summary
        if: ${{ !cancelled() }}
        run: node scripts/junit-summary.ts test-results/junit.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failure traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
