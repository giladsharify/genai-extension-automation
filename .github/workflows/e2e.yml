name: Extension E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Allow/Block policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Actions are pinned to commit SHAs: a tag can be moved to different code.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Download the extension from the Chrome Web Store
        run: npm run fetch-extension

      - name: Type-check
        run: npx tsc -p .

      - name: Run tests
        run: npx playwright test
        # The secrets are only given to this step, not to dependency installs or other actions.
        env:
          PS_API_DOMAIN: ${{ secrets.PS_API_DOMAIN }}
          PS_API_KEY: ${{ secrets.PS_API_KEY }}

      - name: Write job summary
        if: ${{ !cancelled() }}
        run: node scripts/junit-summary.ts test-results/junit.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failure traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: test-results/
          retention-days: 14
